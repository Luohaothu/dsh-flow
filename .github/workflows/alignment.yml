name: Design alignment
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify-alignment.py
      - run: python3 -B -m unittest discover -s tests/alignment -p 'test_*.py'
