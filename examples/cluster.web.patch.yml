# Optional native browser providers for every standard Agent.
# Set FLOW_CHROMIUM_PATH to use an installed Chromium. Flow performs no
# browser capability mapping; the native provider owns its tools and policy.
- insert:
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
    - id: browser-use-playwright-mcp
      name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
      config:
        mode: launch
        headless: true
        executablePath: !!js process.env.FLOW_CHROMIUM_PATH
