# Runtime policy for an installed profile with editable model settings.
# Initialize models in the profile with scripts/initialize-omlx-profile.ts.
# Do not also pass instance.patch.yml or omlx.patch.yml to this deployment.
# Installed packages do not need development source watching. Native settings
# still validate, persist and reconcile through ConfigEditor immediately.
- id: hmr
  disabled: true

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.FLOW_WORKSPACE ?? process.cwd()

# Ordinary sessions keep native permission modes and interactive approval.
# Team members inherit the same native preset and approval policy.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: workspace-write

- id: dsh-flow
  config:
    dataDir: !!js process.env.FLOW_DATA_DIR ?? '.dsh-flow'
    workspace: !!js process.env.FLOW_WORKSPACE ?? process.cwd()
