<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dsh-flow · UI/UX 设计预览</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 设计基线：用户原稿及 2026-10-07 确认。只读观察；指令全部回到主会话；预算仅展示。
       这是可切换的设计场景，不连接宿主、不执行任务。全部姓名、任务、用量都是设计样例。
       原图的暗色、蓝色强调和宿主布局作为视觉锚点。精确 HTML 文本便于审阅和后续开发。
       图示尺寸与样式仅供参考。生产 UI 优先参考官方实现，通过 dsh 或实际 UI 提供方的接口创建。
       UI/UX 唯一设计依据为 ../ux-design.md；旧 Cluster panel、集群模式 profile 及其交互均作废。
       此处独立绘制的宿主外壳仅为离线预览，不可替代生产环境的公开组件与扩展接口。
       此文件及 styles.css/app.js 是图示源；screens/*.png 由 render.mjs 输出。 -->
  <header class="preview-bar">
    <div><strong>dsh-flow</strong><span>界面设计预览</span></div>
    <label>界面 <select id="screen-picker" aria-label="切换设计界面"></select></label>
    <button id="theme-toggle" type="button">切换浅色</button>
    <a href="../ux-design.md">查看开发 spec ↗</a>
  </header>
  <main id="stage"></main>
  <footer class="preview-note"><span id="screen-caption"></span><span>以当前 spec 为准，旧 UI/UX 已废止 · 尺寸与样式仅供参考 · 生产界面通过 dsh / UI 插件接口创建 · 离线样例</span></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
