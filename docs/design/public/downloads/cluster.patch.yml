# 在目标工作目录启动；这两个目录可用环境变量覆盖。
- id: dsh-flow
  config:
    dataDir: !!js process.env.FLOW_DATA_DIR ?? '.dsh-flow'
    workspace: !!js process.env.FLOW_WORKSPACE ?? process.cwd()
    provider: !!js ctx.agentDefaultModel.currentSelection().provider
    model: !!js ctx.agentDefaultModel.currentSelection().model
    reasoningEffort: !!js ctx.agentDefaultModel.currentSelection().reasoningEffort
    # 预算核对只用内置计算工具，不需要文件或命令执行能力。
    defaultCapabilities: []
    # 给规划、执行和独立复核预留总计 30 分钟，实际耗时取决于模型服务。
    defaultBudget:
      wall_time_ms: 1800000

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.FLOW_WORKSPACE ?? process.cwd()

# 普通新会话使用原生工作区修改模式；团队成员会话由 Flow 单独禁用审批请求。
- id: permission
  config:
    presets:
      read-only: { sandbox: read-only, approval: ask }
      workspace-write: { sandbox: workspace-write, approval: ask }
      danger-full-access: { sandbox: danger-full-access, approval: never }
    defaultPreset: workspace-write
