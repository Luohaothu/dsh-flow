  <desc id="desc">H 概况通过图标和数据值呈现任务属性、群信息与停止范围。I 为研究者的收件箱，绿色底消息为普通优先级，灰红底消息为已读的高优先级，正文占满卡片可用宽度。J 展示自身和分支用量及含厂商 Logo 的调用明细。卡片、身份和状态按 1.5 倍展示，页面底部提供图标语义说明。</desc>
