  <g data-message-card="low-unread" transform="translate(816 640)"><title>low 优先级，未读；展开摘要</title><rect width="352" height="156" rx="12" fill="#eef5ff" stroke="#d1e1f3"/><text x="18" y="36" style="font-size:19.5px;font-weight:500;fill:#253247">验证者</text><text x="307" y="36" text-anchor="end" style="font-size:16.5px;fill:rgba(0,0,0,.45);font-variant-numeric:tabular-nums">10:25:14</text><circle cx="329.5" cy="30" r="4.5" fill="rgba(0,0,0,.45)"/><foreignObject x="18" y="54" width="316" height="54"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;min-width:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;font-size:18px;line-height:27px;color:rgba(0,0,0,.61);text-align:justify;text-align-last:left;overflow-wrap:anywhere;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">来源链接已核对，建议补充两项验证结果，并将参数差异、测试配置和核验结论同步给协调者与写作者。</div></foreignObject><g><title>展开摘要</title><path d="m316 126 9 9 9-9" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <text x="32" y="832" class="muted">已读 · 增加灰度，保留淡色相</text><text x="1168" y="832" text-anchor="end" class="small muted">#f3eeee / #eef2ef / #eef0f3</text>
