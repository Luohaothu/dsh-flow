<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1054" viewBox="0 0 1200 1054" role="img" aria-labelledby="title desc">
  <title id="title">当前 Agent 收件箱的消息卡片与优先级色彩规范</title>
  <desc id="desc">I1 发送者与时间；I2 全宽自动换行摘要；I3 红绿蓝底色表达高普通低优先级，已读增加灰度并使用对勾，未读使用六像素实心点；I4 右下角箭头展开和收起摘要。下方展示三种优先级与未读已读状态的六色矩阵。</desc>
  <defs><style>
    text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#263246;font-size:18px;stroke:none}.title{font-size:27px;font-weight:600}.heading{font-size:22px;font-weight:600}.name{font-size:18px;font-weight:600}.small{font-size:16px}.muted{fill:#728096}.blue{fill:#2468bf}.num{fill:#fff;font-size:16px;font-weight:600;text-anchor:middle}.rule{stroke:#e5ebf2}.guide{fill:none;stroke:#9cafc7;stroke-width:1.2;stroke-linecap:round}
  </style></defs>
  <rect width="1200" height="1054" rx="20" fill="#f5f7fa"/>
  <text x="32" y="46" class="title">消息卡片：研究者的收件箱</text><text x="32" y="78" class="muted">消息卡片按 1.5× 规范展示；正文沿卡片可用宽度连续排版。</text>
  <rect x="32" y="110" width="576" height="390" rx="12" fill="#fff" stroke="#dfe6ef"/>
  <text x="56" y="145" class="heading">消息卡片解剖 · 摘要展开</text>
  <g data-message-card="normal-unread" transform="translate(74 180)"><title>normal 优先级，未读；完整摘要</title><rect width="490" height="183" rx="12" fill="#eef9f0" stroke="#cfe5d4"/><text x="18" y="36" style="font-size:19.5px;font-weight:500;fill:#253247">验证者</text><text x="445" y="36" text-anchor="end" style="font-size:16.5px;fill:rgba(0,0,0,.45);font-variant-numeric:tabular-nums">10:25:14</text><circle cx="467.5" cy="30" r="4.5" fill="rgba(0,0,0,.45)"/><foreignObject x="18" y="54" width="454" height="81"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;min-width:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;font-size:18px;line-height:27px;color:rgba(0,0,0,.61);text-align:justify;text-align-last:left;overflow-wrap:anywhere;">来源链接已核对，建议补充两项验证结果，并将参数差异、测试配置和核验结论同步给协调者与写作者。同时保留原始链接和核验时间，便于后续复查。</div></foreignObject><g><title>收起摘要</title><path d="m454 159 9-9 9 9" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <g><rect x="37" y="194" width="32" height="28" rx="7" fill="#2468bf"/><text x="53" y="213" class="num">I1</text><path d="M69 208h23" class="guide"/></g>
  <g><rect x="37" y="253" width="32" height="28" rx="7" fill="#2468bf"/><text x="53" y="272" class="num">I2</text><path d="M69 267h23" class="guide"/></g>
  <g><rect x="571" y="194" width="32" height="28" rx="7" fill="#2468bf"/><text x="587" y="213" class="num">I3</text><path d="M571 208h-23" class="guide"/></g>
  <g><rect x="571" y="327" width="32" height="28" rx="7" fill="#2468bf"/><text x="587" y="346" class="num">I4</text><path d="M571 341h-23" class="guide"/></g>
  <text x="74" y="408" class="small muted">实际尺寸：圆角 8px · 内边距 12px · 间距 12px</text><text x="74" y="439" class="small muted">正文 12px / 18px · 内容间距 8px</text>

  <rect x="634" y="110" width="534" height="390" rx="12" fill="#fff" stroke="#dfe6ef"/>
  <g transform="translate(658 148)"><rect width="32" height="28" y="-20" rx="7" fill="#2468bf"/><text x="16" y="-1" class="num">I1</text><text x="46" y="2" class="heading">发送者与时间</text><text x="46" y="33">名称左对齐，时间与阅读状态图标靠右。</text></g>
  <path d="M658 199h486" class="rule"/>
  <g transform="translate(658 230)"><rect width="32" height="28" y="-20" rx="7" fill="#2468bf"/><text x="16" y="-1" class="num">I2</text><text x="46" y="2" class="heading">全宽正文</text><text x="46" y="33">正文独占整行；自动换行、两端对齐。</text><text x="46" y="60" class="muted">末行左对齐；默认两行，展开完整摘要。</text></g>
  <path d="M658 309h486" class="rule"/>
  <g transform="translate(658 340)"><rect width="32" height="28" y="-20" rx="7" fill="#2468bf"/><text x="16" y="-1" class="num">I3</text><text x="46" y="2" class="heading">底色与阅读状态</text><text x="46" y="33">high 红 / normal 绿 / low 蓝；已读灰化。</text><text x="46" y="60" class="muted">未读为 6px 实心点，已读为小对勾。</text></g>
  <path d="M658 419h486" class="rule"/>
  <g transform="translate(658 450)"><rect width="32" height="28" y="-20" rx="7" fill="#2468bf"/><text x="16" y="-1" class="num">I4</text><text x="46" y="2" class="heading">展开与收起</text><text x="46" y="33">右下角箭头切换方向，随摘要调整高度。</text></g>

  <text x="32" y="545" class="heading">三种优先级 × 两种阅读状态</text>
  <text x="208" y="585" text-anchor="middle" class="name">high · 红色</text><text x="600" y="585" text-anchor="middle" class="name">normal · 绿色</text><text x="992" y="585" text-anchor="middle" class="name">low · 蓝色</text>
  <text x="32" y="622" class="muted">未读</text><text x="1168" y="622" text-anchor="end" class="small muted">#fff0f0 / #eef9f0 / #eef5ff</text>
  <g data-message-card="high-unread" transform="translate(32 640)"><title>high 优先级，未读；展开摘要</title><rect width="352" height="156" rx="12" fill="#fff0f0" stroke="#efd2d2"/><text x="18" y="36" style="font-size:19.5px;font-weight:500;fill:#253247">验证者</text><text x="307" y="36" text-anchor="end" style="font-size:16.5px;fill:rgba(0,0,0,.45);font-variant-numeric:tabular-nums">10:25:14</text><circle cx="329.5" cy="30" r="4.5" fill="rgba(0,0,0,.45)"/><foreignObject x="18" y="54" width="316" height="54"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;min-width:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;font-size:18px;line-height:27px;color:rgba(0,0,0,.61);text-align:justify;text-align-last:left;overflow-wrap:anywhere;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">来源链接已核对，建议补充两项验证结果，并将参数差异、测试配置和核验结论同步给协调者与写作者。</div></foreignObject><g><title>展开摘要</title><path d="m316 126 9 9 9-9" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/></g></g>
