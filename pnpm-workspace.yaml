packages:
  - packages/*
  - tests/acceptance/seeds/website

# The vendored Typert face is for generation; runtime dependencies use the
# published protocol. Only explicit workspace: dependencies link locally.
linkWorkspacePackages: false

# Native runtime dependencies need their install helpers. The Google SDK's
# preinstall is a no-op and does not need to run.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true

patchedDependencies:
  '@deepseek-ai/dsh-api-remotes@0.2.0-rc.2': patches/@deepseek-ai__dsh-api-remotes@0.2.0-rc.2.patch
  '@deepseek-ai/dsh-api-session-controller@0.2.0-rc.2': patches/@deepseek-ai__dsh-api-session-controller@0.2.0-rc.2.patch
  '@deepseek-ai/dsh-client-ui-chat@0.2.0-rc.2': patches/@deepseek-ai__dsh-client-ui-chat@0.2.0-rc.2.patch
  '@deepseek-ai/dsh-client-ui-commands@0.2.0-rc.2': patches/@deepseek-ai__dsh-client-ui-commands@0.2.0-rc.2.patch
  '@deepseek-ai/dsh-client-ui-conversation@0.2.0-rc.2': patches/@deepseek-ai__dsh-client-ui-conversation@0.2.0-rc.2.patch
  '@deepseek-ai/dsh-client-ui-dockkit@0.2.0-rc.2': patches/@deepseek-ai__dsh-client-ui-dockkit@0.2.0-rc.2.patch
  '@deepseek-ai/dsh-client-ui-layout@0.2.0-rc.2': patches/@deepseek-ai__dsh-client-ui-layout@0.2.0-rc.2.patch
  '@deepseek-ai/dsh-client-ui-plan@0.2.0-rc.2': patches/@deepseek-ai__dsh-client-ui-plan@0.2.0-rc.2.patch
