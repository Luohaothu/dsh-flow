# The standard plugin owns execution, Remote reads and the main-session command.
# The removed Cluster panel and cluster preset are not registered.
- insert:
    - id: dsh-flow
      name: dsh-flow
      # The route comes from the host's default-model provider. A composition
      # without that provider supplies a complete `config` instead and drops
      # this row-level `inject`.
      inject: [agentDefaultModel]
      config:
        provider: !!js ctx.agentDefaultModel.currentSelection().provider
        model: !!js ctx.agentDefaultModel.currentSelection().model
        reasoningEffort: !!js ctx.agentDefaultModel.currentSelection().reasoningEffort

    - id: dsh-flow-web
      name: dsh-flow/web

    - id: dsh-flow-agent-team-command
      name: dsh-flow/command
